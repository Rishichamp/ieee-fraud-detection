name: IEEE Fraud Detection CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run API tests
        run: pytest tests/ -v --tb=short

      - name: Check code style
        run: |
          pip install flake8
          flake8 api/ preprocessing/ scripts/ --max-line-length=100 --ignore=E501,W503
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api -t fraud-api:latest .

      - name: Build Dashboard image
        run: docker build -f Dockerfile -t fraud-dashboard:latest .

      - name: Test API health
        run: |
          docker run -d --name fraud-api -p 8000:8000 fraud-api:latest
          sleep 10
          curl -f http://localhost:8000/health || echo "Health check failed"
          docker stop fraud-api
